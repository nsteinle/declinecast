name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU-only PyTorch first, so pip does not pull the CUDA build)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q
      - name: Full-size checks on the bundled model and data
        if: matrix.python-version == '3.12'
        run: pytest -q -m slow
      - name: Build and check the distribution
        run: |
          python -m build
          twine check --strict dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t declinecast .
      - run: docker run --rm declinecast datasets
      - run: docker run --rm declinecast quality
      - name: Validate, score and export inside the container (small runs)
        run: |
          mkdir -p work
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/work:/work" declinecast \
            validate --out validation --n-sbc 100 --n-per-history 50 --draws 100
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/work:/work" declinecast \
            score --split development --out dev --max-wells 60 --draws 100 --bootstrap 100
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/work:/work" declinecast \
            tableau --score dev --validation validation --out tableau
          test -s work/tableau/reliability.csv
          test -s work/tableau/pp.csv
